<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROMACRAFT — Ancient Rome</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  #game { display: block; width: 100%; height: 100%; }
  .pixel { font-family: 'Courier New', monospace; font-weight: bold; }

  /* title / pause overlay */
  #overlay {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px;
    background: linear-gradient(rgba(20,12,8,0.25), rgba(20,12,8,0.55));
    z-index: 10; transition: opacity 0.25s;
  }
  #overlay.hidden { opacity: 0; pointer-events: none; }
  #start-title {
    font-family: 'Courier New', monospace; font-weight: bold;
    font-size: clamp(42px, 8vw, 92px); letter-spacing: 6px; color: #f5c842;
    text-shadow: 4px 4px 0 #6b3b1a, 8px 8px 0 rgba(0,0,0,0.35);
  }
  #start-sub {
    font-family: 'Courier New', monospace; font-size: clamp(14px, 2vw, 20px);
    color: #fff; text-shadow: 2px 2px 0 rgba(0,0,0,0.6); letter-spacing: 2px;
  }
  #startbtn {
    font-family: 'Courier New', monospace; font-weight: bold; font-size: 22px;
    padding: 14px 44px; cursor: pointer; color: #fff; letter-spacing: 2px;
    background: #7da642; border: 3px solid #2b1a10;
    box-shadow: inset 0 -6px 0 rgba(0,0,0,0.3), inset 0 4px 0 rgba(255,255,255,0.25), 4px 4px 0 rgba(0,0,0,0.4);
  }
  #startbtn:hover { background: #8fbf4d; }
  #controls {
    font-family: 'Courier New', monospace; font-size: 14px; color: #eee;
    background: rgba(20,14,10,0.65); border: 2px solid rgba(255,255,255,0.2);
    padding: 12px 20px; line-height: 1.7; text-align: center;
  }
  #controls b { color: #f5c842; }

  /* crosshair */
  #crosshair {
    position: fixed; left: 50%; top: 50%; width: 22px; height: 22px;
    transform: translate(-50%, -50%); display: none; z-index: 5; pointer-events: none;
  }
  #crosshair::before, #crosshair::after {
    content: ''; position: absolute; background: rgba(255,255,255,0.85);
    mix-blend-mode: difference;
  }
  #crosshair::before { left: 50%; top: 0; width: 2px; height: 100%; transform: translateX(-50%); }
  #crosshair::after { top: 50%; left: 0; height: 2px; width: 100%; transform: translateY(-50%); }

  /* hotbar */
  #hotbar {
    position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
    display: none; gap: 4px; z-index: 5;
  }
  .slot {
    width: 54px; height: 54px; position: relative; cursor: pointer;
    background: rgba(30,30,34,0.75); border: 3px solid #555;
    box-shadow: inset 0 0 0 2px rgba(0,0,0,0.5);
  }
  .slot.sel { border-color: #fff; }
  .slot canvas { width: 100%; height: 100%; image-rendering: pixelated; }
  .slot span {
    position: absolute; left: 4px; top: 2px; font-family: monospace;
    font-size: 11px; color: #ddd; text-shadow: 1px 1px 0 #000;
  }
  #blocktip {
    position: fixed; left: 50%; bottom: 78px; transform: translateX(-50%);
    font-family: 'Courier New', monospace; font-weight: bold; font-size: 18px;
    color: #fff; text-shadow: 2px 2px 0 #000; opacity: 0; transition: opacity 0.4s;
    z-index: 5; pointer-events: none;
  }

  /* toast (pointer-lock fallback notice) */
  #toast {
    position: fixed; left: 50%; top: 18%; transform: translateX(-50%);
    font-family: 'Courier New', monospace; font-weight: bold; font-size: 15px;
    color: #fff; background: rgba(30,20,12,0.85); border: 2px solid #f5c842;
    padding: 10px 18px; z-index: 8; display: none; text-align: center;
    pointer-events: none; letter-spacing: 1px;
  }

  /* hints */
  #hints {
    position: fixed; left: 12px; bottom: 12px; display: none; z-index: 5;
    font-family: monospace; font-size: 12px; color: rgba(255,255,255,0.85);
    text-shadow: 1px 1px 0 #000; line-height: 1.6; pointer-events: none;
  }
  #hints b { color: #f5c842; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="overlay">
  <div id="start-title" class="pixel">ROMACRAFT</div>
  <div id="start-sub">⚔ &nbsp;ANCIENT ROME · 79 AD&nbsp; ⚔</div>
  <button id="startbtn">Enter Rome</button>
  <div id="controls">
    <b>WASD</b> move &nbsp;·&nbsp; <b>Mouse</b> look &nbsp;·&nbsp; <b>Space</b> jump &nbsp;·&nbsp; <b>Shift</b> sprint<br>
    <b>Left click</b> mine &nbsp;·&nbsp; <b>Right click</b> place &nbsp;·&nbsp; <b>1–9 / wheel</b> select block<br>
    <b>F</b> fly &nbsp;·&nbsp; <b>R</b> respawn &nbsp;·&nbsp; <b>M</b> mute &nbsp;·&nbsp; <b>Esc</b> pause<br>
    Meet the citizens — they have lives of their own.
  </div>
</div>

<div id="crosshair"></div>
<div id="hotbar"></div>
<div id="blocktip"></div>
<div id="toast"></div>
<div id="hints">
  <b>F</b> fly · <b>R</b> respawn · <b><span id="mutelabel">M mute</span></b>
</div>

<script type="importmap">
{ "imports": { "three": "./js/lib/three.module.js" } }
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
